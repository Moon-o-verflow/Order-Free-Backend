<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>결제 테스트</title>
    <!-- 토스페이먼츠 결제창 SDK v2 -->
    <script src="https://js.tosspayments.com/v2/standard"></script>
    <style>
        body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; color: #1f2937; }
        h1 { font-size: 20px; }
        fieldset { border: 1px solid #d1d5db; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; }
        label { display: inline-block; width: 90px; }
        input { width: 120px; padding: 4px 6px; margin: 4px 0; }
        button { padding: 8px 14px; margin-right: 6px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
        button:disabled { background: #9ca3af; cursor: default; }
        pre { background: #f3f4f6; padding: 12px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; font-size: 13px; }
        .ok { color: #15803d; } .err { color: #b91c1c; }
    </style>
</head>
<body>
<h1>Order-Free 결제 테스트 (토스페이먼츠 테스트 모드)</h1>

<fieldset>
    <legend>1. 결제 준비</legend>
    <div><label>매장 ID</label><input id="storeId" value="1"></div>
    <div><label>테이블 ID</label><input id="tableId" value="1"></div>
    <div><label>주문 ID</label><input id="orderId" value="1"></div>
    <button id="prepareBtn" onclick="prepare()">결제 준비</button>
</fieldset>

<fieldset>
    <legend>2. 결제창</legend>
    <button id="payBtn" onclick="openPayment()" disabled>카드 결제</button>
    <div>테스트 모드라 실제 돈은 나가지 않습니다.</div>
</fieldset>

<div id="status"></div>
<pre id="log"></pre>

<script>
    const $ = (id) => document.getElementById(id);
    let prepared = null;

    function show(msg, ok = true, data) {
        $('status').innerHTML = `<p class="${ok ? 'ok' : 'err'}">${msg}</p>`;
        if (data !== undefined) $('log').textContent = JSON.stringify(data, null, 2);
    }

    async function call(method, url, body) {
        const res = await fetch(url, {
            method,
            headers: body ? { 'Content-Type': 'application/json' } : {},
            body: body ? JSON.stringify(body) : undefined,
        });
        const data = await res.json().catch(() => ({}));
        return { status: res.status, data };
    }

    async function prepare() {
        const url = `/api/stores/${$('storeId').value}/tables/${$('tableId').value}/orders/${$('orderId').value}/payments`;
        const { status, data } = await call('POST', url);
        if (status !== 200 && status !== 201) return show(`결제 준비 실패 (${status})`, false, data);
        prepared = data;
        sessionStorage.setItem('prepared', JSON.stringify(data));
        $('payBtn').disabled = data.status !== 'READY';
        show(`결제 준비 완료: ${data.amount.toLocaleString()}원, 상태 ${data.status}`, true, data);
    }

    async function openPayment() {
        const { data: config } = await call('GET', '/api/payments/config');
        if (!config.clientKey) return show('TOSS_CLIENT_KEY가 서버에 설정되지 않았습니다.', false);

        // 연타 방지(UX 보조). 실제 중복 방어는 서버가 한다.
        $('payBtn').disabled = true;
        const payment = TossPayments(config.clientKey).payment({ customerKey: TossPayments.ANONYMOUS });
        const back = window.location.origin + window.location.pathname;
        try {
            await payment.requestPayment({
                method: 'CARD',
                amount: { currency: 'KRW', value: prepared.amount },
                orderId: prepared.pgOrderId,
                orderName: prepared.orderName,
                successUrl: back + '?result=success',
                failUrl: back + '?result=fail',
            });
        } catch (e) {
            $('payBtn').disabled = false;
            show(`결제창 오류: ${e.code || ''} ${e.message || e}`, false);
        }
    }

    // 3. 결제창에서 돌아온 뒤: successUrl 이면 서버에 승인 요청
    async function handleRedirect() {
        const q = new URLSearchParams(location.search);
        if (q.get('result') === 'fail') {
            return show(`결제창에서 실패/취소: [${q.get('code')}] ${q.get('message')}`, false);
        }
        if (q.get('result') !== 'success') return;

        // 새로고침해도 승인이 다시 나가지 않게 주소에서 파라미터를 지운다 (서버도 멱등 처리함)
        history.replaceState(null, '', location.pathname);
        const body = { paymentKey: q.get('paymentKey'), orderId: q.get('orderId'), amount: Number(q.get('amount')) };
        show('승인 요청 중...');
        const { status, data } = await call('POST', '/api/payments/confirm', body);
        if (status === 200) return show('결제 승인 완료 (DONE)', true, data);
        if (status === 202) return pollUntilSettled(body.orderId, data);
        show(`승인 실패 (${status})`, false, data);
    }

    // 202: 결과 확정 대기 — 서버가 PG 조회로 확정할 때까지 주기적으로 조회
    async function pollUntilSettled(pgOrderId, last) {
        show(`결과 확인 중 (${last.status})...`, true, last);
        for (let i = 0; i < 10; i++) {
            await new Promise((r) => setTimeout(r, 3000));
            const { data } = await call('GET', `/api/payments/${pgOrderId}`);
            if (data.status === 'DONE') return show('결제 승인 완료 (DONE)', true, data);
            if (data.status === 'FAILED') return show('결제 실패 (FAILED)', false, data);
        }
        show('아직 확정되지 않았습니다. 잠시 후 다시 조회하세요.', false);
    }

    const saved = sessionStorage.getItem('prepared');
    if (saved) prepared = JSON.parse(saved);
    handleRedirect();
</script>
</body>
</html>
